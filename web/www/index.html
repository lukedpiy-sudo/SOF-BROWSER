<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soldier of Fortune - browser client</title>
<style>
	html, body { margin: 0; padding: 0; background: #0f1115; overflow: hidden;
		font-family: monospace; color: #d0d0d0; }
	#wrap { position: relative; width: 100vw; height: 100vh; }
	#gl { display: block; width: 100%; height: 100%; }
	#hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
	#bar { position: absolute; left: 0; bottom: 0; width: 100%; padding: 6px 10px;
		background: rgba(0,0,0,0.55); font-size: 12px; }
	#sof-loading { position: absolute; inset: 0; display: flex; align-items: center;
		justify-content: center; flex-direction: column; gap: 10px; pointer-events: none;
		background: radial-gradient(circle at center, rgba(5,8,12,0.78), rgba(2,3,5,0.96));
		color: #d8d8d8; font-family: monospace; z-index: 5; }
	#sof-loading.hidden { display: none; }
	#sof-loading .title { font-size: 24px; font-weight: bold; color: #d9a441;
		letter-spacing: 2px; }
	#sof-loading .sub { font-size: 13px; color: #9aa0a8; }
	a { color: #6cf; }
	#console { position: absolute; left: 0; right: 0; bottom: 34px; display: none;
		background: rgba(5,8,10,0.94); border-top: 1px solid #2a3a2f; padding: 8px 10px; }
	#consoleLog { max-height: 34vh; overflow-y: auto; font-size: 12px; line-height: 1.35; }
	#consoleLog div.cmd { color: #9fe8a0; }
	#consoleLog div.info { color: #7fb0ff; }
	#consoleInput { width: 100%; background: #0f1216; color: #d8d8d8; border: 1px solid #2a3a2f;
		font-family: monospace; font-size: 12px; padding: 3px 5px; margin-top: 6px; }
</style>
<link rel="stylesheet" href="menu.css?v=20261124e">
</head>
<body>
<div id="wrap">
	<canvas id="gl"></canvas>
	<canvas id="hud" width="640" height="330"></canvas>
	<div id="sof-loading">
		<div class="title">CONNECTING TO SERVER</div>
		<div class="sub" id="sof-loading-sub">starting handshake&hellip;</div>
	</div>
	<div id="console">
		<div id="consoleLog"></div>
		<input id="consoleInput" type="text" autocomplete="off" spellcheck="false"
			placeholder="type a command and press enter (help)">
	</div>
	<div id="bar">
		Soldier of Fortune browser client [build 20261124e] &mdash; <b>Esc</b> menu, <b>Tab</b> scoreboard,
		<b>`</b> console, <b>V</b> camera, WASD to move &mdash;
		<a href="content.html">content &amp; mods</a>
	</div>
</div>
<script src="bundle.js?v=20261124e"></script>
<script src="sof.js?v=20261124e"></script>
<script src="sofmodel.js?v=20261124e"></script>
<script src="app.js?v=20261124e"></script>
<script src="viewmodel.js?v=20261124e"></script>
<script src="sofgl.js?v=20261124e"></script>
<script src="soflight.js?v=20261124e"></script>
<script src="sofsurface.js?v=20261124e"></script>
<script src="sofpredict.js?v=20261124e"></script>
<script src="sofmusic.js?v=20261124e"></script>
<script src="eft.js?v=20261124e"></script>
<script src="effects.js?v=20261124e"></script>
<!-- the menu runs last so it can apply settings to every renderer/audio module -->
<script src="menu.js?v=20261124e"></script>
</body>
</html>
